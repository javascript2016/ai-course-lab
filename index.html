<body><main class="wrap"><header><div><div class="eyebrow">AI LAB / 课堂实验路线</div><h1>同一个选课场景，三个创建任务</h1><p>先做咨询智能体，再创建检查工作流，最后整理调整技能。</p></div><div class="tools"><button class="tool" id="tour">从头讲解 →</button><button class="tool" id="zoom" aria-pressed="false">投屏大字</button></div></header>

<script>
const sections=(...pairs)=>pairs.map(([h,t])=>`<h3>${h}</h3>${t}`).join('');const para=t=>`<p>${t}</p>`;const list=a=>'<ul>'+a.map(t=>'<li>'+t+'</li>').join('')+'</ul>';const quote=t=>'<blockquote>'+t+'</blockquote>';
const raw='我已通过的课程仅有Python程序设计。本学期完整拟选清单为数据结构、概率论基础、学术写作、人工智能伦理、创新实践和机器学习入门，希望尽量保留原方案。';
const courses=[['Python程序设计',3,'周一1—2节','无'],['数据结构',3,'周二1—2节','Python程序设计'],['概率论基础',3,'周三1—2节','无'],['机器学习入门',3,'周四1—2节','Python程序设计、概率论基础'],['数据可视化',2,'周二1—2节','Python程序设计'],['人工智能伦理',2,'周五1—2节','无'],['学术写作',2,'周四1—2节','无'],['创新实践',3,'周五3—4节','无']];
const data={};function add(id,g,t,intro,body){data[id]={g,t,intro,body};return id}
add('prep','开始之前','实验准备','三个任务共用一份资料，先统一判断依据。',sections(['固定规则',list(['总学分12～18分，包含两个端点。','先修课程必须已通过；正在修读和本学期拟选都不算通过。','同一时段不能同时选课；已通过课程不能重复修读。','信息不足先询问或明确记录，不能自行假设。所有课程均有余量。'])],['固定课程表','<table><tr><th>课程</th><th>学分</th><th>时间</th><th>先修</th></tr>'+courses.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table>'],['操作位置',para('左侧开发对话：创建和修改要求。右侧预览：测试智能体对话。工作流画布上的“试运行”：执行整套工作流。')]));
const lanes=[{title:'创建选课咨询智能体',tag:'任务一 / 对话咨询',cls:'',sub:'问清情况，再给出有依据的回答',nodes:[['a1','理解需求','明确要问什么、查什么、回答什么'],['a2','填写提示词模板','角色 · 输入 · 资料 · 步骤 · 格式'],['a3','创建智能体','在左侧开发对话发送创建要求'],['a4','在右侧测试对话','追问能力 · 不合格方案 · 合格方案'],['a5','结果符合预期？','按标准逐项评价，不能只看结论'],['a6','保存任务一成果','提示词 + 对话截图 + 测试评价']]},{title:'创建选课工作流',tag:'任务二 / 固定流程',cls:'green',sub:'按固定顺序，检查整个选课方案',nodes:[['b1','明确流程','开始 → 检查 → 汇总 → 结束'],['b2','填写提示词模板','每个节点的输入、处理和输出'],['b3','创建并查看工作流','检查连线、资料和数据引用'],['b4','手动试运行三组方案','先预测 → 再运行 → 对照结果'],['b5','结果符合预期？','检查上游判断与最终报告是否一致'],['b6','保存任务二成果','提示词 + 流程截图 + 运行结果']]},{title:'创建选课方案调整技能',tag:'任务三 / 可复用方法',cls:'orange',sub:'把调整方法保存为技能说明与资料',nodes:[['c1','明确调整方法','发现问题 → 提出调整 → 全面复查'],['c2','填写提示词模板','场景 · 输入 · 资料 · 原则 · 步骤 · 输出'],['c3','创建文字规则类技能','SKILL.md + 课程参考资料'],['c4','人工核查文件和案例','资料完整吗？调整后会全面复查吗？'],['c5','说明能指导正确处理？','检查规则与偏好冲突的处理方法'],['c6','保存任务三成果','提示词 + 技能文件 + 核查结果']]}];
add("a1","任务一 / 需求","理解选课咨询需求","让学生通过对话，弄清自己的选课方案是否可行。","<h3>我们要做什么</h3><p>创建一个能用文字对话的<strong>选课咨询智能体</strong>，帮助学生判断自己的选课方案是否符合规则，并说明原因。</p><h3>学生会怎样提问</h3><blockquote>我想选机器学习入门，可以吗？</blockquote><p>只知道想选哪门课，还不能判断。助手还需要了解学生已经通过哪些课，以及本学期准备选的完整课程清单。</p><h3>助手需要怎样回答</h3><p><strong>情况不清楚时，先问清楚。</strong>缺少已通过课程或完整拟选清单时，主动追问，不猜测。</p><p><strong>情况清楚后，检查整个方案。</strong>依据实验提供的固定规则和课程表，检查学分、先修要求、时间冲突和重复修读。课程学分、时间等资料不用学生反复提供。</p><p><strong>给出结论，也说明依据。</strong>符合规则时说明为什么可以；存在问题时指出具体课程和原因；信息仍不足时说明还需要补充什么。</p>");
add("a2","任务一 / 提示词","填写选课咨询助手创建模板","把需求写清楚，再填六个空，完成第一版创建提示词。","<h3>先理解你在写什么</h3><p>提示词就是你交给扣子的<strong>创建要求</strong>：要做什么助手、需要了解什么、按什么规则判断、最后怎样回答。</p><p>这里写“助手应该怎样做”。某位学生已通过哪些课、想选哪些课，留到后面的测试对话中输入。</p><h3>按这三个问题组织</h3><p><strong>做什么？</strong>说明助手的名称、服务对象和目标。</p><p><strong>怎样判断？</strong>先了解已通过课程与完整拟选清单；缺信息就追问，信息齐全后按固定资料完成四项检查。</p><p><strong>怎样回答？</strong>说明学分计算、逐项依据、全部问题和最终结论，让用户知道为什么可以或不可以。</p><h3>填写下面的六个空</h3><table><tr><th>空位</th><th>填写内容</th></tr><tr><td>① 名称</td><td>给助手命名，如“选课咨询助手”。</td></tr><tr><td>② 服务对象</td><td>谁会使用它，如“准备选课的学生”。</td></tr><tr><td>③ 目标</td><td>它要帮助用户判断什么，如“判断完整选课方案是否符合规则”。</td></tr><tr><td>④ 所需信息</td><td>写清已通过课程和本学期完整拟选课程清单。</td></tr><tr><td>⑤ 检查内容</td><td>列出学分、先修要求、时间冲突和重复修读。</td></tr><tr><td>⑥ 回答内容</td><td>写明总学分与计算过程、逐项检查依据、全部问题及最终结论。</td></tr></table><p>只替换【①～⑥】中的内容。下面的规则和8门课程直接保留，不凭记忆重写。</p><h3>填空式创建模板</h3><p>复制模板到自己的草稿，填完六个空，再保存为第一版提示词。</p><pre class=\"prompt-template\">请创建一个纯文字对话的“【①助手名称】”，帮助【②服务对象】依据以下实验资料【③要完成的事情】。\n\n回答前，需要了解用户的【④需要提供的两类课程信息】。信息不足时先询问，不得自行假设。用户咨询新增课程时，应确认加入后的完整拟选方案。\n\n收到完整情况后，检查整个方案的【⑤四项检查内容】，并在回答中给出【⑥需要展示的结果和依据】。\n\n固定规则：\n1. 本学期拟选总学分为12～18分，包含12分和18分。\n2. 先修课程必须已通过，正在修读或本学期拟选都不算已通过。\n3. 同一时段课程不能同时选择。\n4. 已通过课程不能重复选择。\n5. 信息不足先询问，不得自行假设；明确回答“无”与没有提供信息不同。\n6. 所有课程均有余量，不需要检查名额。\n\n课程表（名称｜学分｜上课时间｜先修课程）：\nPython程序设计｜3｜周一1—2节｜无\n数据结构｜3｜周二1—2节｜Python程序设计\n概率论基础｜3｜周三1—2节｜无\n机器学习入门｜3｜周四1—2节｜Python程序设计、概率论基础\n数据可视化｜2｜周二1—2节｜Python程序设计\n人工智能伦理｜2｜周五1—2节｜无\n学术写作｜2｜周四1—2节｜无\n创新实践｜3｜周五3—4节｜无</pre><h3>填完后检查</h3><p>确认没有遗漏空位、保留了完整规则和8门课程，且没有把某位学生的选课记录写成固定条件。</p><p>下一步，把填好的整段提示词发送到左侧开发对话，创建助手。</p><h3>检查一下自己的理解</h3><p>④应该填“已通过Python程序设计”，还是“用户已通过的课程和本学期完整拟选清单”？</p><details><summary>查看解释</summary><p>填后者。创建要求要适用于不同学生；“已通过Python程序设计”是某次测试的具体输入。</p></details>");
add('a3','任务一 / 创建','创建选课咨询智能体','在扣子编程选择创建智能体。',sections(['操作',list(['把填好的提示词及完整课程资料发送到左侧开发对话。','等待生成，在右侧找到“Agent效果测试”或对话预览区。','确认名称、角色要求和固定资料正确，再开始手动测试。'])],['区分两个对话区',para('对左侧说“请修改检查要求”；对右侧说“我想选这几门课”。创建时不要求自动测试或发布。')]));
add("a4","任务一 / 测试","在右侧测试对话","先少给信息，再补齐信息；最后新建对话，检查合格方案。","<p>在右侧“Agent效果测试”中操作。用两段对话检查三项能力：追问信息、找全问题、判断合格方案。每轮先预测，再发送，最后展开参考结果核对。</p><h3>1 新建右侧对话，只给一句咨询</h3><blockquote>我想选机器学习入门，可以吗？</blockquote><p>想一想：助手还需要知道什么？发送后，观察它有没有追问。</p><details><summary>查看核对标准</summary><p>应询问已通过课程和本学期完整拟选清单。可以介绍先修要求，但不能假设课程记录或直接断言整个方案合格。</p></details>\n<h3>2 在同一段对话补齐信息</h3><blockquote>我已通过的课程只有Python程序设计。概率论基础正在修读，尚未通过。本学期完整拟选课程是数据结构、概率论基础、学术写作、人工智能伦理、创新实践和机器学习入门。请检查这个方案是否可行，并说明依据。</blockquote><p>发送前先算总学分，检查先修、时间冲突和重复修读，再对照助手的回答。</p><details><summary>查看参考结果</summary><p>16分；机器学习入门缺少已通过的概率论基础，并与学术写作在周四1—2节冲突；无重复修读。方案不合格。两项问题都要找出，其他检查也要有正确依据。</p></details>\n<h3>3 新建另一段对话，检查合格方案</h3><blockquote>我已通过的课程只有Python程序设计。本学期完整拟选课程是数据结构、概率论基础、学术写作、人工智能伦理和创新实践。请检查这个方案是否可行，并说明依据。</blockquote><p>新建对话，避免上一段课程记录影响本次判断。先预测，再发送。</p><details><summary>查看参考结果</summary><p>13分；数据结构的先修已通过，其他四门课无先修要求；无时间冲突、无重复修读。方案合格，四项都应给出依据。</p></details>\n<h3>4 记录测试结果</h3><p>分别记录“追问信息、找全问题、判断合格方案”是否通过，并保留回答。有错误时，写下实际回答与预期要求的差别，下一步再修改提示词和复测。</p><p>想一想：回答“不合格”，是否代表测试没有通过？</p><details><summary>查看解释</summary><p>不是。方案是否合格是判断对象；测试是否通过，取决于助手有没有按要求作出正确、完整的判断。</p></details>\n");
add('a5','任务一 / 评价与修改','结果符合预期吗','结论正确，还要检查信息、计算和依据是否正确。',sections(['怎样评价',para('分别记录“追问信息、找全问题、判断合格方案”是否通过，摘录回答作为证据。漏追问、漏违规、计算错误或缺少依据，都需要定位原因。')],['未通过时怎么改',list(['漏问课程清单：修改提示词的输入要求。','把正在修读当作已通过或漏查：修改处理步骤。','只有结论没有解释：补充回答格式。'])],['复测',para('回到左侧修改要求，再新建右侧对话。先重测失败案例，再复测其他案例；信息不足和补全信息两步要在同一段新对话中依次进行。')]));
add('a6','任务一 / 成果','保存任务一成果','留下从第一版要求到验证结果的证据。',sections(['提交内容',list(['第一版和最终版提示词。','三项测试的评价及依据。','信息不足与补全信息的连续对话截图，以及合格方案的独立对话截图。','有修改时，记录问题、修改内容与复测结果。'])],['进入下一任务',para('接下来把整套选课检查固定为工作流。学习顺序继续向下，工具不需要接入任务一。')]));
add("b1","任务二 / 流程","明确四个节点的职责","本任务需要设置四个节点，并按下面的顺序连接。","<h3>设置四个节点，按顺序连接</h3><p><strong>开始 → 检查选课方案 → 汇总结果 → 结束</strong></p><table><tr><th>节点</th><th>负责什么</th></tr><tr><td>开始</td><td>接收已通过课程和本学期完整拟选课程。</td></tr><tr><td>检查选课方案</td><td>依据固定规则和课程表，检查选课方案。</td></tr><tr><td>汇总结果</td><td>整理检查结果和依据，给出最终结论。</td></tr><tr><td>结束</td><td>返回汇总报告。</td></tr></table><p>下一步，把这四个节点及其要求写进工作流创建提示词。</p>");
add("b2","任务二 / 提示词","填写工作流创建模板","填写8个空，把四个节点的分工和数据来源说清楚。","<h3>这次提示词要写清什么</h3><p>沿着四个节点，把“接收什么、检查什么、交给下一步什么”写清楚。下面已提供完整框架，你只需填写8个空。</p><h3>每个空怎么填</h3><table><tr><th>空位</th><th>填写提示</th></tr><tr><td>① 名称</td><td>填写“选课方案检查”。</td></tr><tr><td>② 任务</td><td>说明要检查学生的完整选课方案是否符合固定规则。</td></tr><tr><td>③ 流程</td><td>按上一节的顺序填写四个节点，用箭头连接。</td></tr><tr><td>④ 已通过清单</td><td>写清passed_courses表示已通过课程。</td></tr><tr><td>⑤ 拟选清单</td><td>写清planned_courses表示本学期完整拟选课程。</td></tr><tr><td>⑥ 检查数据来源</td><td>写清使用开始节点传入的passed_courses和planned_courses。</td></tr><tr><td>⑦ 汇总数据来源</td><td>写清引用“检查选课方案”节点的实际输出。</td></tr><tr><td>⑧ 最终返回内容</td><td>写清返回“汇总结果”节点的输出。</td></tr></table><p><strong>只替换带①～⑧编号的空位。</strong>固定规则、8门课程、检查步骤和结论顺序直接保留；【固定规则】等标题不用替换。不要把某个学生的选课记录写进创建要求。</p><h3>填空式创建模板</h3><p>复制到草稿中，按上表填空，保存为第一版提示词。</p><pre class=\"prompt-template\">请创建一个“【①工作流名称】”工作流，按照固定规则【②要完成的任务】，输出逐项检查结果、依据和最终结论。\n\n一、流程结构\n\n严格采用以下流程：\n【③四个节点的连接顺序】。\n本任务独立创建，不需要接入其他智能体或技能。\n\n二、开始节点\n\n设置两个输入字段，均可使用文本输入多个课程名称：\n- passed_courses：【④这份清单的含义】。\n- planned_courses：【⑤这份清单的含义】，必须填写整个方案，不是仅填写准备新增的课程。\n\n两个字段均须提供。明确填写“无”表示没有课程，与没有提供信息不同。\n\n三、检查选课方案节点\n\n将以下完整规则和课程表固定写入本节点，不依赖用户在每次运行时重复提供。不得生成示例课程、替换课程名称、改变课程学分或修改学分范围。\n\n【固定规则】\n1. 最终选课总学分须为12～18分，包含12分和18分。\n2. 先修课程必须已通过，正在修读不算通过；本学期拟选的课程不能当作已通过的先修课程。\n3. 同一时段课程不能同时选择。\n4. 已通过课程不能重复选择。\n5. 信息不足时不得自行假设，应指出缺失信息。\n6. 所有课程均有余量，不需要检查名额。\n\n【固定课程表】\n| 课程 | 学分 | 上课时间 | 先修课程 |\n| --- | --- | --- | --- |\n| Python程序设计 | 3 | 周一1—2节 | 无 |\n| 数据结构 | 3 | 周二1—2节 | Python程序设计 |\n| 概率论基础 | 3 | 周三1—2节 | 无 |\n| 机器学习入门 | 3 | 周四1—2节 | Python程序设计、概率论基础 |\n| 数据可视化 | 2 | 周二1—2节 | Python程序设计 |\n| 人工智能伦理 | 2 | 周五1—2节 | 无 |\n| 学术写作 | 2 | 周四1—2节 | 无 |\n| 创新实践 | 3 | 周五3—4节 | 无 |\n\n【输入引用】\n使用【⑥实际检查数据来自哪里，包含哪些字段】作为实际检查数据，不得使用写死的测试数据代替。\n\n【检查步骤】\n必须完成以下全部检查，不得在发现第一项问题后停止：\n\n1. 学分检查\n列出拟选课程及对应学分，计算整个拟选方案的总学分，判断是否在12～18分以内。已通过课程不计入本学期学分，除非它出现在拟选清单中；若出现在拟选清单中，还须报告重复修读问题。\n\n2. 先修检查\n逐门检查拟选课程的全部先修要求，比较对象必须是“已通过课程”。指出所有不满足先修要求的课程及缺少的先修课程。\n\n3. 时间冲突检查\n比较全部拟选课程的上课时间，列出所有冲突课程对及具体时间。同一天但节次不重叠不算冲突。\n\n4. 重复修读检查\n比较“拟选课程”与“已通过课程”，列出两者重合的课程。不能仅凭课程表判断，也不能将此项误解为只检查拟选清单中是否出现重名。\n\n5. 信息完整性检查\n如果课程名称无法与固定课程表匹配，或必要信息未提供，应明确记录，不能自行补全、猜测课程含义或编造课程资料。仍须完成能够确定的其他检查。\n\n【节点输出】\n输出以下内容，供汇总节点直接引用：\n- 原始输入的两份课程清单。\n- 总学分及计算过程；无法确定时说明原因。\n- 学分、先修、时间冲突、重复修读四项的检查结果和依据。\n- 全部明确违规项。\n- 缺失或无法确认的信息。\n\n四、汇总结果节点\n\n必须引用【⑦哪个节点的实际输出】，不得独立生成一份与上游无关的判断，不得遗漏上游已发现的问题。\n\n按以下优先顺序确定最终结论：\n1. 存在任何明确违规项：不合格。即使同时存在缺失信息，也须保留“不合格”结论并说明缺失内容。\n2. 没有明确违规项，但必要信息缺失：信息不足。\n3. 所有条件均满足：合格。\n\n汇总输出格式：\n- 总学分与计算过程。\n- 逐项检查结果：检查项目、是否满足、具体依据。\n- 全部问题或待补充信息。\n- 最终结论：合格／不合格／信息不足。\n\n五、结束节点\n\n返回【⑧哪个节点的输出】。\n\n请完成工作流创建，供我手动试运行，不要自动执行测试。</pre><h3>填完以后</h3><p>检查8个空是否填齐，节点名称与字段名是否前后一致，规则与课程表是否完整。下一步，把填好的整段提示词发送到扣子编程，创建并查看工作流。</p>");
add("b3","任务二 / 创建","创建并查看工作流","看结构、查输入、核对输出，再试运行整个流程。","<h3>先创建，再沿着数据查看</h3><p>发送上一环节填好的创建提示词和完整资料。生成后，按下面的顺序查看。此时要确认：<strong>流程连对了吗？每个节点拿到的数据对吗？</strong></p><h3>1．看画布：四个节点是否连好</h3><p>找到<strong>开始 → 检查选课方案 → 汇总结果 → 结束</strong>，确认顺序和连线完整。</p><figure class=\"workflow-figure\"><a href=\"assets/workflow-overview.png\" target=\"_blank\" rel=\"noopener\" aria-label=\"放大查看：四个节点依次连接，画布右上方有试运行按钮\"><img src=\"assets/workflow-overview.png\" alt=\"四个节点依次连接，画布右上方有试运行按钮\" loading=\"lazy\"></a><figcaption>图1　先看整体结构，再逐个打开节点 · 点击图片查看原图</figcaption></figure><p>线连好了，还要继续检查输入引用。连线正确不代表数据一定传对。</p><h3>2．看检查节点：清单从哪里来</h3><p>点击“检查选课方案”，查看右侧面板的<strong>输入</strong>与<strong>输出</strong>。</p><figure class=\"workflow-figure\"><a href=\"assets/workflow-check-node.png\" target=\"_blank\" rel=\"noopener\" aria-label=\"放大查看：检查选课方案节点的输入为两份课程清单，输出包含课程列表、总学分和违规项\"><img src=\"assets/workflow-check-node.png\" alt=\"检查选课方案节点的输入为两份课程清单，输出包含课程列表、总学分和违规项\" loading=\"lazy\"></a><figcaption>图2　输入接收课程清单，输出交给汇总节点 · 点击图片查看原图</figcaption></figure><table><tr><th>看哪里</th><th>核对什么</th></tr><tr><td>输入</td><td>passed_courses、planned_courses对应开始节点传入的两份清单，不能写死某个案例。</td></tr><tr><td>输出</td><td>包含总学分与计算过程、四项检查结果及依据、全部违规和缺失信息。</td></tr><tr><td>节点说明或实现内容</td><td>完整保存6条规则和8门课程，要求完成全部检查。</td></tr></table><p>图中展示的是字段定义，<strong>还不是运行结果</strong>。string表示文本，array表示列表，不用背这些类型名称。</p><p>截图没有展开完整规则，也不能仅凭“开始节点传入”这句描述确认实际引用正确。还需查看节点内容与输入来源，下一步再用整流程运行核对。</p><h3>3．看汇总和结束：结果有没有接上</h3><p>打开“汇总结果”，确认总学分、违规项和缺失信息来自<strong>检查节点的实际输出</strong>。再看“结束”，确认返回汇总报告。</p><blockquote>例如：检查节点算出16分，并发现先修不满足、时间冲突。汇总报告应保留这些结果，最终判为“不合格”。</blockquote><p>只核对字段名称还不够，要核对它引用哪个节点的值。若界面看不到来源，可要求扣子展示引用关系，再通过试运行核实。</p><h3>4．分清两个测试入口</h3><table><tr><th>入口</th><th>用途</th></tr><tr><td>画布上的“试运行”</td><td>运行整个工作流，检查节点之间的数据传递和最终报告。</td></tr><tr><td>节点面板的“测试”</td><td>单独检查当前节点，便于定位问题。</td></tr></table><figure class=\"workflow-figure\"><a href=\"assets/workflow-single-node-test.png\" target=\"_blank\" rel=\"noopener\" aria-label=\"放大查看：标题为单节点运行的表单，填写两份清单后底部有试运行按钮\"><img src=\"assets/workflow-single-node-test.png\" alt=\"标题为单节点运行的表单，填写两份清单后底部有试运行按钮\" loading=\"lazy\"></a><figcaption>图3　这是单节点运行，不是整个工作流 · 点击图片查看原图</figcaption></figure><p><strong>看面板标题，不只看按钮名称。</strong>图3底部也叫“试运行”，但上方写着“单节点运行”，因此这里只运行当前节点，不能证明汇总和结束节点已接对。</p><h3>检查完，进入下一步</h3><p>确认四个节点、固定资料和数据引用后，点击画布上的<strong>“试运行”</strong>。下一环节用三组方案核对实际结果。</p><details><summary>想一想：单节点测试正确，整个工作流就一定正确吗？</summary><p>不一定。检查节点可能算对，但汇总节点仍可能没有引用它的输出，或结束节点返回了错误内容。还需要运行整个流程。</p></details>");
add("b4","任务二 / 测试","手动试运行三组方案","先预测，再运行，对照结果后回顾三组测试的关系。","<h3>这一步要验证什么</h3><p>验证工作流能否根据每次输入，正确检查<strong>完整选课方案</strong>。三组的已通过课程始终只有Python程序设计；每次只新增一门拟选课程，便于比较前后结果。</p><h3>怎么测，怎样算通过</h3><p><strong>先预测 → 再运行 → 对照依据 → 记录差异。</strong></p><p>使用画布上的“试运行”。每次填写两份完整清单，不只填新增课程。先写下预期，再运行，最后展开参考答案核对。</p><p>核对<strong>课程清单、总学分、四项检查结果、全部问题及依据、最终结论</strong>。结论正确但漏报问题，也不算通过。</p><table><tr><th>预期结果</th><th>实际结果</th><th>是否一致</th></tr><tr><td>自己先判断，再用参考答案核对</td><td>记录工作流实际输出</td><td>不一致时写清具体差异</td></tr></table><h3>第一组：检查这份方案</h3><blockquote>passed_courses：<br>Python程序设计<br><br>planned_courses：<br>数据结构、概率论基础、学术写作、人工智能伦理、创新实践</blockquote><p>先根据固定课程表计算学分，再检查先修、时间冲突和重复修读。写下你的预期结果，然后运行。</p><details><summary>查看第一组预期结果</summary><table><tr><th>检查项目</th><th>预期结果</th></tr><tr><td>学分</td><td>3＋3＋2＋2＋3＝13分，满足要求。</td></tr><tr><td>先修</td><td>数据结构要求的Python程序设计已通过，其余四门无先修要求。</td></tr><tr><td>时间冲突</td><td>无。</td></tr><tr><td>重复修读</td><td>无。</td></tr><tr><td>最终结论</td><td>合格。</td></tr></table><p><strong>评价重点：</strong>四项都应检查并说明依据，不能凭空报告问题。</p></details><h3>第二组：加入数据可视化</h3><p>在第一组中加入<strong>数据可视化</strong>，其他条件不变。先判断新增这门课会影响哪些检查，再运行对照。</p><blockquote>passed_courses：<br>Python程序设计<br><br>planned_courses：<br>数据结构、概率论基础、学术写作、人工智能伦理、创新实践、数据可视化</blockquote><details><summary>查看第二组预期结果</summary><table><tr><th>检查项目</th><th>预期结果</th></tr><tr><td>学分</td><td>13＋2＝15分，满足要求。</td></tr><tr><td>先修</td><td>全部满足；数据可视化要求的Python程序设计已通过。</td></tr><tr><td>时间冲突</td><td>数据结构与数据可视化同在周二1—2节。</td></tr><tr><td>重复修读</td><td>无。</td></tr><tr><td>最终结论</td><td>不合格。</td></tr></table><p><strong>评价重点：</strong>准确指出这一对冲突及时间。学分、先修满足，不代表整个方案合格。</p></details><h3>第三组：再加入机器学习入门</h3><p>在第二组中再加入<strong>机器学习入门</strong>。哪些检查结果会变化？哪些应该保持不变？先判断，再运行对照。</p><blockquote>passed_courses：<br>Python程序设计<br><br>planned_courses：<br>数据结构、概率论基础、学术写作、人工智能伦理、创新实践、数据可视化、机器学习入门</blockquote><details><summary>查看第三组预期结果</summary><table><tr><th>检查项目</th><th>预期结果</th></tr><tr><td>学分</td><td>15＋3＝18分，满足要求；18分是允许的上限。</td></tr><tr><td>先修</td><td>机器学习入门缺少已通过的概率论基础；本学期拟选不算已通过。</td></tr><tr><td>时间冲突</td><td>① 数据结构与数据可视化：周二1—2节。<br>② 机器学习入门与学术写作：周四1—2节。</td></tr><tr><td>重复修读</td><td>无。</td></tr><tr><td>最终结论</td><td>不合格。</td></tr></table><p><strong>评价重点：</strong>找全1项先修问题和2对时间冲突。不能发现一项就停止，也不能只查刚新增的课程。</p></details><h3>完成三组后：回顾测试逻辑</h3><details><summary>展开回顾：为什么每次只新增一门课？</summary><p>输入变化明确，才能看清结果为什么变化。三组是在设计测试数据，不是在修复选课方案。</p><div class=\"test-progression\"><span><b>① 正常情况</b><small>13分，合格：检查是否误报</small></span><i>↓ 加数据可视化</i><span><b>② 单个问题</b><small>15分，一对冲突：检查能否发现新问题</small></span><i>↓ 加机器学习入门</i><span><b>③ 多个问题</b><small>18分，先修问题＋两对冲突：检查能否找全</small></span></div><p>第三组达到18分仍满足学分规则，但其他检查不满足，所以整个方案仍不合格。</p></details><h3>1．先判断：测试通过了吗？</h3><p><strong>方案不合格，不等于测试不通过。</strong>只要工作流的判断和依据都符合预期，这组测试就通过。</p><blockquote>第三组应报告：1项先修问题、2对时间冲突，最终“不合格”。如果只报告先修问题，即使结论正确，测试仍不通过。</blockquote><h3>2．没通过：先查哪里漏了</h3><p>展开这次运行详情，按顺序核对：</p><table><tr><th>检查位置</th><th>发现问题后怎么办</th></tr><tr><td>开始输入</td><td>课程清单填错或漏填：改正输入，重新运行。</td></tr><tr><td>检查节点输出</td><td>输入正确，却没查出两对冲突：补充检查节点的要求。</td></tr><tr><td>汇总报告</td><td>检查节点已列出冲突，报告却漏了：修正汇总节点的引用或汇总要求。</td></tr></table><p>确认出错位置后，在下一步学习怎样向扣子提出具体修改要求。</p><h3>3．改完：验证问题修好了吗？</h3><p>先重跑出错的那一组，确认问题已修好；再重跑另一组之前通过的案例，确认没有引入新错误。例如，第三组漏报冲突时，先复测第三组，再复测之前通过的第一组。</p><p>不要改动正确的测试输入来迁就错误输出。</p><h3>三组都通过后</h3><p>可完成本实验的基础测试。这三组尚未测试学分不足或超限、12分下限、重复修读、未知课程和缺失信息；这些情况需要另外设计案例。</p><h3>想一想</h3><p>检查节点已经列出两对冲突，但最终报告没有写。应该先检查哪个节点？</p><details><summary>查看答案</summary><p>先检查<strong>汇总结果节点</strong>，确认它引用并保留了检查节点的实际输出。</p></details>");
add('b5','任务二 / 评价与修改','结果符合预期吗','先确定错误出现在哪一层，再修改对应要求并复测。',sections(['先核对输入和预期',para('对照上一页三组预期结果，检查完整课程清单、总学分、全部违规、具体依据及最终结论。先排除自己输入或人工计算有误。')],['沿流程定位错误','<table><tr><th>看到的问题</th><th>重点检查哪里</th></tr><tr><td>实际使用的课程清单不对</td><td>检查节点是否引用开始节点的真实输入。</td></tr><tr><td>学分算错，漏掉先修或冲突</td><td>检查节点的规则、课程表和检查要求。</td></tr><tr><td>检查节点发现问题，最终报告却没写</td><td>汇总节点是否引用并保留上游结果。</td></tr><tr><td>有违规却判成合格</td><td>汇总节点的结论判断规则。</td></tr></table>'],['在左侧提出具体修改',quote('第三组测试中，“检查选课方案”节点只报告了先修不满足，遗漏了数据结构与数据可视化在周二1—2节、机器学习入门与学术写作在周四1—2节的两对冲突。请修改该节点，比较全部拟选课程的时间，发现一项违规后仍继续完成其他检查，保留其他规则。')+para('说明哪个节点、出现什么错误、希望怎样修改，不要只说“结果不对”。')],['修改后怎样复测',list(['确认节点已更新，再使用画布上的“试运行”。','先重跑出错案例，检查原问题是否解决。','再重跑一组之前通过的案例，确认修改没有破坏原有表现。','保存修改内容和复测结果；三组均符合预期时完成基础测试。'])]));
add('b6','任务二 / 成果','保存任务二成果','让别人看清流程是怎样运行、怎样得出结论的。',sections(['提交内容',list(['第一版和最终版提示词。','完整工作流截图。','三组运行结果，并任选一组解释判断依据。','有修改时附错误记录、修改要求和复测结果。'])],['进入下一任务',para('已经能检查方案，接下来把“发现问题后怎样调整”的方法整理成技能。')]));
add('c1','任务三 / 方法','明确选课调整方法','先满足规则，再尽量保留原方案和明确偏好。',sections(['处理顺序',list(['发现问题：检查原方案全部规则，列出问题与依据。','提出调整：说明保留、删除、新增或替换哪些课程，列出完整新清单。','全面复查：对新方案重新计算学分，检查先修、冲突和重复修读。'])],['关键原则',para('不能修改已通过记录、课程学分、时间或先修条件。若删课后学分不足，只能从固定课程表补充符合条件的课程，并再次全面复查。')]));
add('c2','任务三 / 提示词','填写技能创建模板','描述一套可重复使用的方法，而不是代替某个学生作一次回答。',sections(['六个部分',list(['使用场景：何时触发选课方案调整。','所需输入：已通过课程、完整拟选清单、保留偏好。','固定资料：完整规则与课程表，要求处理前读取。','调整原则：规则优先，再保留明确偏好和其他原课程。','处理步骤：发现问题、调整、全面复查。','输出格式：原问题、修改内容、新清单、复查结果、最终结论。'])],['文件安排',para('SKILL.md保存用途和处理方法；references/rules-and-courses.md保存规则与课程表。主文件明确引用参考文件并要求读取。')]));
add('c3','任务三 / 创建','创建文字规则类技能','把前面设计好的调整方法交给扣子，生成技能说明和配套资料。',sections(
['什么是文字规则类技能',para('可以把它理解为一份给智能体看的<strong>操作说明书，加上完成任务需要查阅的资料</strong>。说明书告诉它“先发现问题，再提出调整，最后全面复查”；资料提供课程的学分、时间和先修要求。')+para('本实验用文字说明指导智能体，不需要学生编写程序。“文字规则类”描述的是本实验的做法，不是要求在界面上找到一个同名选项。')],
['第一步：发送创建要求和完整资料',para('回到扣子编程首页，选择“技能”。将上一环节填好的创建提示词发送到开发对话中，名称写为<strong>选课方案调整</strong>。提示词应包含使用场景、所需输入、固定资料、调整原则、处理步骤和输出格式。')+para('同时提供完整的<strong>6条规则和8门课程资料</strong>。不要只写“按照前面的课程表”，这次创建需要拿到实际资料。')+'<table><tr><th>你在做什么</th><th>应该发送什么</th></tr><tr><td>现在创建技能</td><td>“请创建一个技能，按这些规则和步骤处理选课调整……”</td></tr><tr><td>以后使用技能</td><td>“我已通过Python程序设计，准备选这些课程，请帮我调整……”</td></tr></table>'],
['第二步：打开生成的技能文件',para('生成后打开文件树，也就是文件列表，找到并点开技能主文件和课程参考文件。本实验约定的文件安排如下，实际外层文件夹名称可以不同。')+'<div class="skill-files"><div><strong>选课方案调整 /</strong></div><div>├─ <code>SKILL.md</code><p>操作说明书：什么时候用、需要什么、按什么步骤处理、如何输出。</p></div><div>└─ <code>references/</code><div class="file-child"><code>rules-and-courses.md</code><p>配套资料：完整的固定选课规则与课程表。</p></div></div></div>'+para('<strong>主文件写方法，参考文件存依据。</strong>还要把两个文件连起来：SKILL.md应明确要求读取参考资料，例如：')+quote('调整前先读取 references/rules-and-courses.md，所有判断以其中的规则和课程表为依据。')+para('只有课程表文件存在还不够；主文件必须说明去哪里读取、什么时候读取。')],
['第三步：先核查内容，再判断是否完成',para('不要只凭对话中的“创建成功”结束。点开文件，确认规则和课程资料完整、引用路径与实际文件一致，并写明“找全问题 → 列出完整新方案 → 全面复查”。')+para('下一步会用案例人工推演：机器学习入门缺少先修且与学术写作冲突，删除它后其余五门共13分。检查技能说明能否指导这一过程。')+para('<strong>人工核查与实际调用测试不同。</strong>人工核查检查说明和资料是否合理；实际调用测试要让智能体加载技能，再观察输出。文件合理不代表运行一定正确。')],
['本任务做到哪里',para('必做部分先完成技能说明、文字参考资料和案例人工核查。固定资料已足够支持练习，不添加脚本、外部接口或服务，也暂不接入任务一的咨询智能体；实际接入与调用留到选做部分。')+para('这是本实验的范围安排，不表示所有技能都只能包含文字。')],
['想一想',para('如果课程表已经保存，但SKILL.md没有提到它，你会要求扣子补充什么？')+'<details><summary>先自己回答，再查看提示</summary><p>补充参考文件的明确路径，要求调整前读取，并以其中规则和课程表为判断依据；再核对引用路径与实际文件是否一致。</p></details>']));
add("c4","任务三 / 人工核查","核查文件和案例","先查资料，再照着文件推演案例，找出需要补充的要求。","<h3>这一步要完成什么</h3><p>打开你创建的技能文件，照着说明手工走完两个案例，检查<strong>资料是否正确、方法是否完整</strong>。这一步由你读文件和推演，还不需要接入智能体运行。</p><h3>1．打开文件，核对资料</h3><p>打开<strong>SKILL.md</strong>和它引用的课程参考文件，对照实验资料核对：</p><ul><li>规则是否完整；8门课程的名称、学分、时间和先修条件是否准确。</li><li>SKILL.md引用的参考文件是否存在，路径是否一致。</li><li>是否明确要求处理前先读取参考资料。</li></ul><p>发现缺漏先记录，不要仅凭“已创建成功”判断文件完整。</p><h3>2．读案例一，按文件走一遍</h3><blockquote>已通过课程：仅Python程序设计。<br>完整拟选课程：数据结构、概率论基础、学术写作、人工智能伦理、创新实践、机器学习入门。<br>偏好：尽量保留原方案。</blockquote><p>按技能文件中的方法，依次写下<strong>原方案的问题 → 调整后的完整清单 → 全面复查结果</strong>。每一步同时摘录一句对应的文件要求；找不到就记为缺项。</p><p>例如，文件写了“比较全部先修要求与已通过清单”，你就据此查表判断。<strong>文件不必写出这个案例的答案，但要写清怎样处理。</strong></p><details><summary>完成推演后，查看参考结果</summary><p>原方案16分。机器学习入门缺少已通过的概率论基础，还与学术写作同在周四1—2节，存在时间冲突。</p><p>删除机器学习入门，保留其他五门。重新检查：3＋3＋2＋2＋3＝13分；数据结构的先修已满足，其他课程无先修要求；无时间冲突、无重复修读。调整后合格。</p><p>对照文件：是否要求找全问题、尽量保留原课程、说明修改原因、列出完整新清单，并重新检查全部规则？</p></details><h3>3．改变一个要求，再按文件判断</h3><p>案例一的已通过课程和原拟选清单保持不变，只把偏好改为：</p><blockquote>我坚持本学期保留机器学习入门。</blockquote><p>先判断能否满足这个要求，再找出技能文件中<strong>规则与偏好冲突时的处理要求</strong>。不要只凭自己的常识回答。</p><details><summary>完成判断后，查看参考结果</summary><p>概率论基础尚未通过，当前无法同时满足先修规则和坚持保留机器学习入门的要求。文件应规定：偏好不能覆盖规则，无法满足时说明原因，不能把拟选视为已通过，也不能把违规方案称为合格。</p><p>若用户愿意放宽保留要求，案例一的13分方案仍可行。这是某项偏好无法满足，不是所有方案都无解。</p></details><h3>4．记录缺项，修改后再核查</h3><p>用下面三列记录，不需要写长报告：</p><table><tr><th>要核查的要求</th><th>文件中的对应语句</th><th>是否需要补充</th></tr><tr><td>调整后全面复查</td><td>摘录实际语句；没有就写“未找到”</td><td>是否覆盖学分、先修、冲突和重复修读</td></tr></table><p>如果缺少复查要求，可以在左侧开发对话发送：</p><blockquote>请补充：调整后必须对完整新方案重新计算总学分，并检查先修、时间冲突和重复修读；复查发现问题时继续调整并再次全面复查。</blockquote><p>修改后重新打开文件，确认要求已补入，再按两个案例走一遍。原文件已完整时，保留核查记录即可，不必强行修改。</p><h3>怎样判断这一步完成</h3><p><strong>资料准确、引用正确，两个案例需要的处理要求都能在文件中找到。</strong>保存对应语句和案例分析；有修改时附复查记录。</p><p>你自己算对，不代表文件已写完整。人工核查通过，也不代表智能体已经成功加载或执行技能；实际调用留到选做部分验证。</p><h3>检查一下自己的理解</h3><p>你算出删除机器学习入门后13分合格，但文件只写“删除冲突课程”，没有要求重新检查。能算核查通过吗？</p><details><summary>查看答案</summary><p>不能。你补上了文件里缺失的步骤，应先补充全面复查要求，再核查。</p></details>");
add('c5','任务三 / 评价与修改','说明能指导正确处理吗','每个判断都应能在文件中找到相应要求。',sections(['通过标准',list(['按固定资料查表，不让用户重复提供已有课程属性。','先满足规则，再考虑偏好；找不到可行方案时如实说明。','调整后重新检查完整方案，而不是只检查删改课程。'])],['不通过时',para('在左侧指出缺失要求，更新技能文件，再人工核查两组案例。文件写得完整不代表运行一定成功；实际加载与执行需要选做验证。')]));

const board=document.querySelector('#board');lanes.forEach((l,i)=>{let html=`<article class="lane ${l.cls}"><div class="lanehead"><span class="badge">${l.tag}</span><h2>${l.title}</h2><p>${l.sub}</p></div>${`<section class="why-skill"><h3>${["为什么要创建选课咨询智能体","为什么要创建选课检查工作流","为什么要创建“选课方案调整”技能"][i]}</h3><p>${["学生提出选课问题时，往往没有说清已通过哪些课、准备选哪些课。创建选课咨询智能体，可以通过对话问清情况，再依据固定规则和课程表给出有依据的回答，帮助学生判断选课是否可行。","选课检查需要同时考虑学分、先修、时间冲突和重复修读。创建选课检查工作流，可以把这些检查安排为固定步骤，明确各节点的输入和输出，便于重复运行、核对结果和定位错误。","工作流能检查出选课方案的问题，但学生还需要知道怎样修改。创建“选课方案调整”技能，可以把调整原则和复查步骤保存为可重复使用的方法，帮助智能体在满足规则的前提下，尽量保留原有课程。"][i]}</p></section>`}`;l.nodes.forEach(([id,t,s],n)=>{html+=`<button class="node ${n===4?'decision':''} ${n===5?'output':''}" data-id="${id}"><strong>${n<4?`<span class="num">0${n+1}</span>`:''}${t}</strong><small>${s}</small></button>`;if(n===4)html+=`<div class="branch"><button class="retry" data-id="${id}">↶ 否：定位问题，返回修改</button><span>是 ↓</span></div>`;else if(n<5)html+='<div class="arrow" aria-hidden="true">↓</div>'});board.insertAdjacentHTML('beforeend',html+'</article>')});
const order=['prep',...lanes.flatMap(l=>l.nodes.map(n=>n[0])),'done','optional'];const dialog=document.querySelector('#detail');let current=0;let origin=null;
function show(id){current=order.indexOf(id);const d=data[id];document.querySelector('#group').textContent=d.g;document.querySelector('#detailTitle').textContent=d.t;document.querySelector('#intro').textContent=d.intro;document.querySelector('#detailBody').innerHTML=d.body;document.querySelector('#position').textContent=`${current+1} / ${order.length}`;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===order.length-1;document.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));document.querySelector(`[data-id="${id}"]`)?.classList.add('active');if(!dialog.open){origin=document.activeElement;dialog.showModal()}dialog.scrollTop=0;}
document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.id)));document.querySelector('#tour').onclick=()=>show('prep');document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>origin?.focus());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});document.querySelector('#prev').onclick=()=>current>0&&show(order[current-1]);document.querySelector('#next').onclick=()=>current<order.length-1&&show(order[current+1]);document.querySelector('#zoom').onclick=e=>{let on=document.body.classList.toggle('projecting');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'恢复字号':'投屏大字'};
</script></body></html>
